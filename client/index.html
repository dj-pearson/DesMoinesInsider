<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Des Moines Insider</title>
    <meta
      name="description"
      content="Events, new restaurant openings, playgrounds and things to do across the Des Moines metro, written for people who live here."
    />
    <meta name="robots" content="index, follow" />
    <!-- Baseline social tags. Each page replaces these once the app loads;
         these are what a crawler that does not run JavaScript will see. -->
    <meta property="og:site_name" content="Des Moines Insider" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Des Moines Insider" />
    <meta
      property="og:description"
      content="Events, new restaurant openings, playgrounds and things to do across the Des Moines metro."
    />
    <meta property="og:image" content="/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
